      <animate attributeName="fill" values="#151131;#8B5CF6;#151131" keyTimes="0;.15;1" dur="4.5s" begin="1.5s" repeatCount="indefinite"/>
    </polygon>
    <ellipse cx="555" cy="134" rx="30" ry="8" fill="#1D1740"/>
