    <rect x="700" y="70" width="380" height="36" rx="16" fill="#1D1740"/>
    <rect x="700" y="92" width="380" height="14" fill="#1D1740"/>
    <circle cx="722" cy="88" r="5" fill="#FF5F57"/><circle cx="740" cy="88" r="5" fill="#FEBC2E"/><circle cx="758" cy="88" r="5" fill="#28C840"/>
    <rect x="790" y="81" width="160" height="14" rx="7" fill="#151131"/>
    <rect x="730" y="132" height="9" rx="4.5" width="120" fill="#8B5CF6" opacity=".85"><animate attributeName="width" values="0;120;120" keyTimes="0;.25;1" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><rect x="750" y="154" height="9" rx="4.5" width="210" fill="#4B4380" opacity=".85"><animate attributeName="width" values="0;210;210" keyTimes="0;.25;1" dur="6s" begin="0.35s" repeatCount="indefinite"/></rect><rect x="750" y="176" height="9" rx="4.5" width="160" fill="#EC4899" opacity=".85"><animate attributeName="width" values="0;160;160" keyTimes="0;.25;1" dur="6s" begin="0.7s" repeatCount="indefinite"/></rect><rect x="730" y="198" height="9" rx="4.5" width="90" fill="#4B4380" opacity=".85"><animate attributeName="width" values="0;90;90" keyTimes="0;.25;1" dur="6s" begin="1.0499999999999998s" repeatCount="indefinite"/></rect><rect x="730" y="220" height="9" rx="4.5" width="230" fill="#8B5CF6" opacity=".85"><animate attributeName="width" values="0;230;230" keyTimes="0;.25;1" dur="6s" begin="1.4s" repeatCount="indefinite"/></rect><rect x="750" y="242" height="9" rx="4.5" width="140" fill="#4B4380" opacity=".85"><animate attributeName="width" values="0;140;140" keyTimes="0;.25;1" dur="6s" begin="1.75s" repeatCount="indefinite"/></rect><rect x="730" y="264" height="9" rx="4.5" width="190" fill="#EC4899" opacity=".85"><animate attributeName="width" values="0;190;190" keyTimes="0;.25;1" dur="6s" begin="2.0999999999999996s" repeatCount="indefinite"/></rect>
    <rect x="730" y="290" width="88" height="14" rx="7" fill="url(#grad)"/>
  </g>

