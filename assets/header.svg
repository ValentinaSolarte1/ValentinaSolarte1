    <rect x="985" y="368" width="104" height="18" rx="9" fill="#1D1740"/>
    <circle cx="996" cy="377" r="6" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="996" cy="377" r="3.2" fill="#EC4899" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.50;.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="1008" y="374" width="40" height="6" rx="3" fill="#4B4380"/>
  </g>

  <!-- Chips flotantes -->
  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="640" y="250" width="92" height="30" rx="15" fill="#1D1740" stroke="#8B5CF6"/>
      <text x="686" y="270" text-anchor="middle" fill="#C4B5FD">React</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 7;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="860" y="345" width="104" height="30" rx="15" fill="#1D1740" stroke="#EC4899"/>
      <text x="912" y="365" text-anchor="middle" fill="#F9A8D4">Compose</text></g>
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="1094" y="96" width="74" height="30" rx="15" fill="#1D1740" stroke="#8B5CF6"/>
      <text x="1131" y="116" text-anchor="middle" fill="#C4B5FD">UI/UX</text></g>
