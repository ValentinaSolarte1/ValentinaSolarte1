<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Laura Valentina Solarte · Frontend Developer</title>
  <desc id="desc">Desarrolladora frontend de aplicaciones web y móviles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0A1D"/><stop offset=".6" stop-color="#151131"/><stop offset="1" stop-color="#1E0F33"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity=".07"/></pattern>
    <clipPath id="card"><rect width="1200" height="420" rx="28"/></clipPath>
    <clipPath id="t0"><rect x="96" y="318" height="30" width="0"><animate attributeName="width" values="0;398;398;0;0" keyTimes="0.0;0.1167;0.2833;0.3333;1" dur="12s" repeatCount="indefinite"/></rect></clipPath><clipPath id="t1"><rect x="96" y="318" height="30" width="0"><animate attributeName="width" values="0;0;355;355;0;0" keyTimes="0;0.3333;0.45;0.6167;0.6667;1" dur="12s" repeatCount="indefinite"/></rect></clipPath><clipPath id="t2"><rect x="96" y="318" height="30" width="0"><animate attributeName="width" values="0;0;345;345;0;0" keyTimes="0;0.6667;0.7833;0.95;1.0;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="880" cy="90" r="170" fill="#8B5CF6" opacity=".45" filter="url(#blur)">
      <animate attributeName="cx" values="880;820;880" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;140;90" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="380" r="150" fill="#EC4899" opacity=".35" filter="url(#blur)">
      <animate attributeName="cx" values="1120;1060;1120" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="420" r="140" fill="#4F46E5" opacity=".25" filter="url(#blur)"/>
    <rect width="1200" height="420" fill="url(#dots)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="419" rx="28" fill="none" stroke="#2C2560"/>

  <!-- Texto -->
  <g>
    <rect x="64" y="70" width="232" height="32" rx="16" fill="#1D1740" stroke="#2C2560"/>
    <circle cx="84" cy="86" r="5" fill="#EC4899">
      <animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="98" y="91" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#C4B5FD">FRONTEND DEVELOPER</text>

    <text x="62" y="172" font-family="'Segoe UI', Inter, system-ui, -apple-system, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#F5F3FF" letter-spacing="-1">Laura Valentina</text>
    <text x="62" y="236" font-family="'Segoe UI', Inter, system-ui, -apple-system, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="url(#grad)" letter-spacing="-1">Solarte</text>
    <text x="64" y="284" font-family="'Segoe UI', Inter, system-ui, -apple-system, Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A9A3CF">Convierto ideas y necesidades en productos web y móviles.</text>

    <text x="64" y="339" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#EC4899">~$</text>
    <text x="98" y="339" clip-path="url(#t0)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#C4B5FD">interfaces web con React y TypeScript</text><text x="98" y="339" clip-path="url(#t1)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#C4B5FD">apps Android con Kotlin y Compose</text><text x="98" y="339" clip-path="url(#t2)" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="18" fill="#C4B5FD">gamificación que motiva a volver</text>
    <rect x="98" y="322" width="2.5" height="22" fill="#EC4899">
      <animate attributeName="x" values="98;496;496;98;98;453;453;98;98;443;443;98;98" keyTimes="0.0;0.1167;0.2833;0.3323;0.3333;0.45;0.6167;0.6657;0.6667;0.7833;0.95;0.999;1" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

