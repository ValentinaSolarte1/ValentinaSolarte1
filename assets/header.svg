    <rect x="1000" y="288" width="70" height="8" rx="4" fill="#4B4380"/>
    
    <rect x="985" y="316" width="104" height="18" rx="9" fill="#1D1740"/>
    <circle cx="996" cy="325" r="6" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="996" cy="325" r="3.2" fill="#EC4899" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.20;.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <rect x="1008" y="322" width="60" height="6" rx="3" fill="#4B4380"/>
    <rect x="985" y="342" width="104" height="18" rx="9" fill="#1D1740"/>
    <circle cx="996" cy="351" r="6" fill="none" stroke="#8B5CF6" stroke-width="2"/>
    <circle cx="996" cy="351" r="3.2" fill="#EC4899" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.30;0.35;.9;1" dur="6s" repeatCount="indefinite"/>
