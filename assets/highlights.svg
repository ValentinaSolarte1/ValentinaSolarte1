<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="2 plataformas, 36 commits en EduRacha, más de 3.300 líneas en Lairn, 15 repositorios públicos">
