name: Animación de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generar SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#8B5CF6&color_dots=#ebedf0,#ddd6fe,#c4b5fd,#a78bfa,#8b5cf6
            dist/snake-dark.svg?palette=github-dark&color_snake=#EC4899&color_dots=#161b22,#2e1065,#5b21b6,#7c3aed,#a78bfa

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
